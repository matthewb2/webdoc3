<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구글 닥스 스타일 자동 페이지 분할</title>
    <style>
        body {
            background-color: #f0f3f6;
            margin: 0;
            padding: 40px 20px;
            font-family: sans-serif;
        }
        
        /* 에디터 메인 컨테이너 */
        #editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        /* A4 규격화 스타일 */
        .page {
            width: 800px;
            min-height: 1000px;
            background: white;
            padding: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
            position: relative;
            outline: none; /* 포커스 시 브라우저 기본 테두리 제거 */
        }
        
        .page::after {
            content: attr(data-page-number);
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
        }
        
        p {
            line-height: 1.6;
            margin: 0 0 16px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="editor-container"></div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
