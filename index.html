<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="main.css">

	<title>정밀 폰트 매트릭스 기반 웹 워커 워드프로세서</title>
    <style>
        
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="ribbon-tabs">
            <span class="ribbon-tab active">홈</span>
            <span id="hwp-status" class="status"></span>
        </div>
        <div class="ribbon-body">
            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <button id="btn-open-file" class="toolbar-btn" type="button">파일 열기</button>
                        <button id="btn-save" class="toolbar-btn" type="button" title="열린 파일의 확장자로 저장 (기본 HWP)">저장</button>
                        <button id="btn-preview" class="toolbar-btn" type="button" title="읽기 전용 미리보기">미리보기</button>
                    </div>
                </div>
                <div class="ribbon-group-title">파일</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="font-family-select">글꼴</label>
                        <select id="font-family-select" class="toolbar-select" disabled>
                          <option>Arial</option>
                          <option>Verdana</option>
                          <option>Tahoma</option>
                          <option>Times New Roman</option>
                          <option>Georgia</option>
                          <option>Courier New</option>
                          <option>맑은 고딕</option>
                          <option>굴림</option>
                          <option>돋움</option>
                          <option>바탕</option>
                          <option>궁서</option>
                          <option>나눔고딕</option>
                          <option>Noto Sans KR</option>
                        </select>
                        <label class="toolbar-label" for="font-size-select">크기</label>
                        <select id="font-size-select" class="toolbar-select" disabled>
                          <option>8</option>
                          <option>9</option>
                          <option>10</option>
                          <option>11</option>
                          <option>12</option>
                          <option>14</option>
                          <option>16</option>
                          <option>18</option>
                          <option>20</option>
                          <option>22</option>
                          <option>24</option>
                          <option>26</option>
                          <option>28</option>
                          <option>32</option>
                          <option>36</option>
                          <option>48</option>
                          <option>72</option>
                        </select>
                    </div>
                    <div class="ribbon-row">
                        <button id="btn-style-normal" class="toolbar-btn" type="button" title="보통 (서식 지우기)">보통</button>
                        <button id="btn-style-bold" class="toolbar-btn toolbar-btn-style" type="button" title="굵게"><b>B</b></button>
                        <button id="btn-style-italic" class="toolbar-btn toolbar-btn-style" type="button" title="기울임"><i>I</i></button>
                        <button id="btn-style-underline" class="toolbar-btn toolbar-btn-style" type="button" title="밑줄"><u>U</u></button>
                    </div>
                </div>
                <div class="ribbon-group-title">글꼴</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="column-count-select">다단</label>
                        <select id="column-count-select" class="toolbar-select">
                          <option value="1">1단</option>
                          <option value="2">2단</option>
                          <option value="3">3단</option>
                        </select>
                        <label class="toolbar-label" for="align-select">정렬</label>
                        <select id="align-select" class="toolbar-select">
                          <option value="left">왼쪽</option>
                          <option value="center">가운데</option>
                          <option value="right">오른쪽</option>
                          <option value="justify">양쪽</option>
                        </select>
                    </div>
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="line-spacing-select">줄간격</label>
                        <select id="line-spacing-select" class="toolbar-select">
                          <option value="100">100%</option>
                          <option value="120">120%</option>
                          <option value="150">150%</option>
                          <option value="160">160%</option>
                          <option value="200">200%</option>
                        </select>
                    </div>
                </div>
                <div class="ribbon-group-title">단락</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="text-color-input">글자색</label>
                        <input id="text-color-input" class="toolbar-color" type="color" value="#000000" title="글자색 (두 번 클릭하면 기본값)">
                    </div>
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="bg-color-input">배경색</label>
                        <input id="bg-color-input" class="toolbar-color" type="color" value="#ffffff" title="배경색 (두 번 클릭하면 없음)">
                    </div>
                </div>
                <div class="ribbon-group-title">색</div>
            </div>
        </div>
        <input id="file-input" type="file" accept=".hwp,.docx,.odt" hidden />
    </div>

    <!-- 가이드선 -->
    <div id="ruler-guide" class="ruler-guide-line"></div>

    <!-- 뷰포트 안에 눈금자와 에디터 컨테이너를 함께 배치하여 스크롤바 영역을 완벽히 공유 -->
    <div class="editor-viewport">
        <div class="ruler-container">
            <div class="ruler-center">
                <div class="ruler-track" id="ruler-track">
                    <div class="ruler-ticks" id="ruler-ticks"></div>
                    <!-- 첫 줄 들여쓰기 마커 (좌우 패딩 오차가 없으므로 기본 100px 내부 여백 기준 + 여백 보정 20px = 120px) -->
                    <div id="marker-first-line" class="ruler-marker ruler-marker-first-line" title="첫 줄 들여쓰기" style="left: 120px;"></div>
                    <!-- 왼쪽 들여쓰기 마커 (120px) -->
                    <div id="marker-left-indent" class="ruler-marker ruler-marker-left-indent" title="왼쪽 들여쓰기" style="left: 120px;"></div>
                </div>
            </div>
        </div>
        <div id="editor-container" spellcheck="false"></div>
    </div>

    <div class="preview-toolbar" style="display:none">
        <span id="preview-mode-label" class="statusbar-info" title="페이지를 클릭하면 쪽맞춤으로 전환">미리보기 (읽기 전용)</span>
        <span class="statusbar-spacer"></span>
        <button id="btn-preview-fit" class="toolbar-btn" type="button" title="화면에 페이지 폭 맞추기">쪽맞춤</button>
        <button id="btn-preview-two-pages" class="toolbar-btn" type="button" title="두 페이지씩 나란히 보기">맞쪽보기</button>
        <button id="btn-preview-edit" class="toolbar-btn" type="button">편집</button>
        <button id="btn-preview-close" class="toolbar-btn" type="button">닫기</button>
    </div>
    <div class="preview-viewport" style="display:none">
        <div id="preview-container"></div>
    </div>
    <!-- 미리보기 전용 상태바 -->
    <div class="preview-statusbar" style="display:none">
        <span id="preview-cursor-page" class="statusbar-info">미리보기 모드</span>
        <span class="statusbar-spacer"></span>
        <button id="btn-preview-zoom-out" class="statusbar-btn" type="button" title="축소">−</button>
        <button id="preview-zoom-label" class="statusbar-zoom" type="button">100%</button>
        <button id="btn-preview-zoom-in" class="statusbar-btn" type="button" title="확대">＋</button>
    </div>

    <div id="cell-menu" class="context-menu" style="display:none">
        <button id="cell-menu-merge" type="button">셀 합치기 (M)</button>
    </div>

    <div class="statusbar">
        <span id="cursor-page" class="statusbar-info" title="커서 위치 페이지">- / -</span>
        <span class="statusbar-spacer"></span>
        <button id="btn-zoom-out" class="statusbar-btn" type="button" title="축소">−</button>
        <button id="zoom-label" class="statusbar-zoom" type="button">100%</button>
        <button id="btn-zoom-in" class="statusbar-btn" type="button" title="확대">＋</button>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const leftIndentMarker = document.getElementById('marker-left-indent');
        const firstLineMarker = document.getElementById('marker-first-line');
        const guideLine = document.getElementById('ruler-guide');
        const rulerTrack = document.getElementById('ruler-track');
        const rulerTicksContainer = document.getElementById('ruler-ticks');

        const MARGIN_LEFT_TRACK = 85; // 페이지 내부 패딩
        const CONTENT_WIDTH = 624; // 순수 편집 영역 너비 (794 - 85*2)
        const TRACK_WIDTH = 794; // A4 페이지 너비
        const SCALE_STEP = 40; 

        let rulerZoom = 1;

        function renderRulerTicks() {
            rulerTicksContainer.innerHTML = '';
            rulerTicksContainer.style.left = `${MARGIN_LEFT_TRACK * rulerZoom}px`;
            for (let px = 0; px <= CONTENT_WIDTH; px += 10) {
                const left = px * rulerZoom;
                const tick = document.createElement('div');
                tick.className = 'ruler-tick';
                tick.style.left = `${left}px`;

                if (px % SCALE_STEP === 0) {
                    tick.classList.add('ruler-tick-major');
                    const value = (px / SCALE_STEP).toFixed(1).replace(/\.0$/, '');
                    const num = document.createElement('span');
                    num.className = 'ruler-number';
                    num.style.left = `${left}px`;
                    num.textContent = value;
                    rulerTicksContainer.appendChild(num);
                } else {
                    tick.classList.add('ruler-tick-sub');
                }
                rulerTicksContainer.appendChild(tick);
            }
        }

        function getTargetParagraph() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return null;
            let node = selection.anchorNode;
            while (node && node.tagName !== 'P') {
                node = node.parentNode;
                if (!node || node.id === 'editor-container') return null;
            }
            return node;
        }

        function updateMarkersFromSelection() {
            const targetP = getTargetParagraph();
            if (!targetP) return;
            const paddingLeft = parseFloat(window.getComputedStyle(targetP).paddingLeft) || 0;
            const textIndent = parseFloat(window.getComputedStyle(targetP).textIndent) || 0;

            leftIndentMarker.style.left = `${(MARGIN_LEFT_TRACK + paddingLeft) * rulerZoom}px`;
            firstLineMarker.style.left = `${(MARGIN_LEFT_TRACK + textIndent) * rulerZoom}px`;
        }

        function setRulerZoom(zoom) {
            const next = Number.isFinite(zoom) && zoom > 0 ? zoom : 1;
            const ratio = next / rulerZoom;
            rulerZoom = next;

            rulerTrack.style.width = `${TRACK_WIDTH * rulerZoom}px`;
            renderRulerTicks();

            if (getTargetParagraph()) {
                updateMarkersFromSelection();
            } else {
                const leftIndent = (parseFloat(leftIndentMarker.style.left) || 0) * ratio;
                const firstLine = (parseFloat(firstLineMarker.style.left) || 0) * ratio;
                leftIndentMarker.style.left = `${leftIndent}px`;
                firstLineMarker.style.left = `${firstLine}px`;
            }
        }

        setRulerZoom(1);
        window.addEventListener('editor-zoom', (event) => {
            setRulerZoom(event.detail && event.detail.zoom);
        });

        let activeMarker = null;

        function updateGuideLine(clientX) {
            guideLine.style.left = `${clientX}px`;
        }

        function onMouseDown(e, marker) {
            activeMarker = marker;
            guideLine.style.display = 'block';
            updateGuideLine(e.clientX);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function onMouseMove(e) {
            if (!activeMarker) return;
            const rect = rulerTrack.getBoundingClientRect();
            const margin = MARGIN_LEFT_TRACK * rulerZoom;
            const content = CONTENT_WIDTH * rulerZoom;
            
            let posX = e.clientX - rect.left;
            posX = Math.max(margin, Math.min(posX, margin + content));

            activeMarker.style.left = `${posX}px`;
            
            const markerRect = activeMarker.getBoundingClientRect();
            updateGuideLine(markerRect.left + markerRect.width / 2);

            const indentValue = (posX - margin) / rulerZoom;
            const targetP = getTargetParagraph();

            if (targetP) {
                if (activeMarker === leftIndentMarker) {
                    targetP.style.paddingLeft = `${Math.max(0, indentValue)}px`;
                } else if (activeMarker === firstLineMarker) {
                    targetP.style.textIndent = `${indentValue}px`;
                }
            }
        }

        function onMouseUp() {
            activeMarker = null;
            guideLine.style.display = 'none';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        leftIndentMarker.addEventListener('mousedown', (e) => onMouseDown(e, leftIndentMarker));
        firstLineMarker.addEventListener('mousedown', (e) => onMouseDown(e, firstLineMarker));

        document.addEventListener('selectionchange', () => {
            updateMarkersFromSelection();
        });
    });
</script>
<script src="/odt/jszip.bundle.js"></script>
<script src="/odt/odt.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
