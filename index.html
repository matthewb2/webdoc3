<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>정밀 폰트 매트릭스 기반 웹 워커 워드프로세서</title>
    <style>
        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: #f0f3f6;
            margin: 0;
            padding: 0;
            font-family: var(--doc-font, '맑은 고딕'), 'Arial', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }

        /* 리본 툴바 */
        :root {
            --ribbon-height: 113px;
        }
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--ribbon-height);
            background: #ffffff;
            border-bottom: 1px solid #d8dde3;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
            font-family: var(--ui-font, '맑은 고딕'), sans-serif;
            overflow: hidden;
        }
        /* 리본 탭 줄 */
        .ribbon-tabs {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 0 0 28px;
            height: 28px;
            padding: 0 10px;
            background: #f8fafc;
            border-bottom: 1px solid #e3e8ee;
            box-sizing: border-box;
        }
        .ribbon-tab {
            position: relative;
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 16px;
            font-size: 12px;
            color: #5a6672;
            white-space: nowrap;
        }
        .ribbon-tab.active {
            color: #1b4f9c;
            font-weight: 600;
        }
        .ribbon-tab.active::after {
            content: '';
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 0;
            height: 2px;
            background: #4a90d9;
        }
        /* 리본 본문: 그룹 가로 배치, 좁은 화면에서는 가로 스크롤 */
        .ribbon-body {
            display: flex;
            align-items: stretch;
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
        }
        .ribbon-group {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 0 0 auto;
            padding: 4px 10px 2px;
        }
        .ribbon-group + .ribbon-group {
            border-left: 1px solid #e6ebf0;
        }
        .ribbon-group-items {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            flex: 1 1 auto;
        }
        .ribbon-group-title {
            flex: 0 0 auto;
            padding-top: 2px;
            font-size: 10px;
            line-height: 1;
            color: #98a2ad;
            text-align: center;
            white-space: nowrap;
        }
        .ribbon-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .toolbar-btn {
            flex: 0 0 auto;
            height: 28px;
            padding: 0 12px;
            border: 1px solid #ccd3da;
            border-radius: 5px;
            background: #f7f9fa;
            color: #333;
            font-size: 13px;
            font-family: inherit;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .toolbar-btn:hover { background: #eef2f5; }
        .toolbar-btn:active { background: #e2e8ee; }
        .toolbar-btn-style { width: 28px; padding: 0; font-size: 14px; }
        .toolbar-btn.active { background: #d7e3f4; border-color: #4a90d9; color: #1b4f9c; }
        .toolbar-label {
            flex: 0 0 auto;
            font-size: 12px;
            color: #5f6b77;
            white-space: nowrap;
        }
        .toolbar-select {
            flex: 0 0 auto;
            height: 28px;
            border: 1px solid #ccd3da;
            border-radius: 5px;
            background: #ffffff;
            color: #333;
            font-size: 13px;
            font-family: inherit;
            padding: 0 6px;
            box-sizing: border-box;
            max-width: 180px;
        }
        .toolbar-select:disabled {
            background: #f0f2f4;
            color: #a6aeb5;
        }
        #font-family-select { width: 180px; }
        #font-size-select { width: 72px; }
        #column-count-select { width: 72px; }
        #align-select { width: 82px; }
        #line-spacing-select { width: 84px; }
        .toolbar-color {
            flex: 0 0 auto;
            width: 40px;
            height: 28px;
            border: 1px solid #ccd3da;
            border-radius: 5px;
            background: #ffffff;
            padding: 2px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .status {
            flex: 0 1 auto;
            min-width: 0;
            font-size: 12px;
            color: #888;
            margin-left: auto;
            padding-left: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

/* 드래그 앤 드롭 오버레이 */
        .editor-viewport.is-dragging::before {
            content: '파일을 놓아주세요';
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(74, 144, 217, 0.12);
            border: 4px dashed #4a90d9;
            color: #2b6cb0;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
        .context-menu {
            position: fixed;
            z-index: 50;
            min-width: 160px;
            background: #ffffff;
            border: 1px solid #ccd3da;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.14);
            padding: 4px;
            box-sizing: border-box;
        }
        .context-menu button {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 13px;
            color: #333;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .context-menu button:hover:not(:disabled) { background: #eef2f5; }
        .context-menu button:disabled { color: #a6aeb5; cursor: default; }
        .hwp-dropzone {
            height: calc(100% - 48px);
            margin: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a94a0;
            font-size: 15px;
            border: 2px dashed #ccd3da;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
        }

        /* 미리보기 모드: 상단 바 + 읽기 전용 뷰포트 */
        .preview-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 46px;
            background: #ffffff;
            border-bottom: 1px solid #d8dde3;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            z-index: 10;
            box-sizing: border-box;
            font-size: 13px;
            color: #333;
            font-family: var(--ui-font, '맑은 고딕'), sans-serif;
        }
        .preview-viewport {
            position: fixed;
            top: 46px;
            right: 0;
            bottom: 0;
            left: 0;
            width: auto;
            height: auto;
            margin: 0;
            overflow: auto;
            padding: 40px 0;
            box-sizing: border-box;
            display: block;
            text-align: center;
            background: #f0f3f6;
        }
        #preview-container {
            display: inline-flex;
            flex-direction: column;
            gap: 30px;
            width: 800px;
            min-width: 800px;
            padding: 0 20px;
            box-sizing: content-box;
            text-align: left;
        }
        #preview-container > * {
            flex-shrink: 0;
        }
        #preview-container .page {
            outline: none;
            cursor: pointer;
        }

        /* [수정] 스크롤바와 패딩을 담당하는 뷰포트 (툴바 높이만큼 상단 여백) */
        .statusbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 28px;
            background: #ffffff;
            border-top: 1px solid #d8dde3;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 12px;
            z-index: 10;
            box-sizing: border-box;
            font-size: 12px;
            color: #555;
            font-family: var(--ui-font, '맑은 고딕'), sans-serif;
        }
        .statusbar-info {
            white-space: nowrap;
        }
        .statusbar-spacer {
            flex: 1;
        }
        .statusbar-btn {
            min-width: 26px;
            height: 22px;
            border: 1px solid #ccd3da;
            border-radius: 4px;
            background: #f7f9fa;
            color: #333;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
        }
        .statusbar-btn:hover { background: #eef2f5; }
        .statusbar-zoom {
            min-width: 52px;
            height: 22px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: #333;
            font-size: 12px;
            cursor: pointer;
        }
        .statusbar-zoom:hover { background: #eef2f5; }
        .editor-viewport {
            position: fixed;
            top: var(--ribbon-height);
            right: 0;
            bottom: 28px;
            left: 0;
            width: auto;
            height: auto;
            margin: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 40px 0; /* 상하 여백만 부여 (좌우 여백은 내부에서 통제) */
            box-sizing: border-box;
            /* ⚠️ 브라우저 버그를 유발하는 grid/flex 정렬을 완전히 제거합니다 */
            display: block; 
            text-align: center; /* 데스크톱 환경에서 자식을 중앙으로 보내기 위한 트리거 */
        }

        /* [수정] 에디터 컨테이너를 감싸는 안전 마진 래퍼 */
        #editor-container {
            /* ⚠️ 인라인 블록으로 지정하여 text-align: center의 영향을 받게 함 (데스크톱 중앙 정렬) */
            display: inline-flex; 
            flex-direction: column;
            gap: 30px;
            width: 800px;
            min-width: 800px;
            
            /* ⚠️ 양옆에 실제 픽셀 여백을 패딩으로 강제 주입하여 모바일 좌우 여백 확보 */
            padding: 0 20px; 
            box-sizing: content-box; /* 패딩이 800px 바깥으로 더해져 총 840px이 되도록 설정 */
            
            /* 텍스트 정렬이 자식에게 상속되는 것을 방지하기 위해 왼쪽 정렬로 리셋 */
            text-align: left;
        }
        /* 줌 높이 고정 시 페이지·스페이서가 찌그러지지 않게 수축 금지 */
        #editor-container > * {
            flex-shrink: 0;
        }

        /* .page 및 하위 요소 스타일은 그대로 유지합니다 */
        .page {
            width: 800px;
            height: 900px;
            background: white;
            padding: 6.25rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
            position: relative;
            outline: none;
            -webkit-text-size-adjust: none;
        }
        /* 다단 컬럼 (선택 영역 플로우) */
        .doc-cols-2 { column-count: 2; column-gap: 20px; }
        .doc-cols-3 { column-count: 3; column-gap: 20px; }
        /* 여백 경계선 (canvas 직선, 본문 경계에 간극 없이 표시) */
        .page canvas.margin-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 900px;
            pointer-events: none;
        }
        .page::after {
            content: attr(data-page-number);
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
        }
        p {
            font-family: var(--doc-font, '맑은 고딕'), 'Arial', sans-serif;
            font-size: 16px;
            line-height: 26px;
            margin: 0;
            padding: 0;
            /* 영문은 단어 단위로 줄바꿈 (한글은 글자 단위 유지) */
            word-break: normal;
            overflow-wrap: anywhere;
        }
        p::after {
            content: " ↵";
            color: #c0c4cc;
            font-weight: normal;
            font-size: 14px;
            user-select: none;
            pointer-events: none;
        }
        p:has(span:empty)::after, 
        p:has(span:contains('\u200B'))::after {
            position: absolute;
            left: 0;
            top: 0;
        }
        /* index.html <style> 내부의 표 스타일 부분을 아래 내용으로 덮어씌우세요 */

table {
    width: 599px; /* 본문 600px - collapse 외곽 절반 테두리 1px */
    border-collapse: collapse;
    margin: 15px 0;
    table-layout: fixed; /* 가로 고정 픽셀 분배 */

    /* 외곽선은 셀 테두리로 형성 (표 자체 테두리는 600px을 초과하므로 제거) */
    border: none;
}

/* ⚠️ td와 함께 th(존재할 경우)까지 완벽하게 테두리를 지정합니다 */
table td, table th {
    /* 지정 너비에 패딩·테두리 포함 (워커 줄바꿈 폭과 일치) */
    box-sizing: border-box;
    /* 기존 옅은 색(#dcdfe6) 대신 살짝 더 선명한 회색(#b0b4b8)으로 변경 */
    border: 1px solid #b0b4b8 !important; 
    padding: 7px 8px; /* 워커의 TABLE_CELL_PADDING 규격과 매칭 */
    font-family: var(--doc-font, '맑은 고딕'), 'Arial', sans-serif;
    font-size: 16px;
    line-height: 26px; /* 워커의 LINE_HEIGHT */
    color: #333;
    word-break: normal;
    overflow-wrap: anywhere;
    vertical-align: top;
    text-align: left;
}

/* 짝수 행 배경 음영 (가독성 향상) */
table tr:nth-child(even) {
    background-color: #f7f9fa;
}
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="ribbon-tabs">
            <span class="ribbon-tab active">홈</span>
            <span id="hwp-status" class="status"></span>
        </div>
        <div class="ribbon-body">
            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <button id="btn-open-file" class="toolbar-btn" type="button">파일 열기</button>
                        <button id="btn-save" class="toolbar-btn" type="button" title="열린 파일의 확장자로 저장 (기본 HWP)">저장</button>
                        <button id="btn-preview" class="toolbar-btn" type="button" title="읽기 전용 미리보기">미리보기</button>
                    </div>
                </div>
                <div class="ribbon-group-title">파일</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="font-family-select">글꼴</label>
                        <select id="font-family-select" class="toolbar-select" disabled>
                          <option>Arial</option>
                          <option>Verdana</option>
                          <option>Tahoma</option>
                          <option>Times New Roman</option>
                          <option>Georgia</option>
                          <option>Courier New</option>
                          <option>맑은 고딕</option>
                          <option>굴림</option>
                          <option>돋움</option>
                          <option>바탕</option>
                          <option>궁서</option>
                          <option>나눔고딕</option>
                          <option>Noto Sans KR</option>
                        </select>
                        <label class="toolbar-label" for="font-size-select">크기</label>
                        <select id="font-size-select" class="toolbar-select" disabled>
                          <option>8</option>
                          <option>9</option>
                          <option>10</option>
                          <option>11</option>
                          <option>12</option>
                          <option>14</option>
                          <option>16</option>
                          <option>18</option>
                          <option>20</option>
                          <option>22</option>
                          <option>24</option>
                          <option>26</option>
                          <option>28</option>
                          <option>32</option>
                          <option>36</option>
                          <option>48</option>
                          <option>72</option>
                        </select>
                    </div>
                    <div class="ribbon-row">
                        <button id="btn-style-normal" class="toolbar-btn" type="button" title="보통 (서식 지우기)">보통</button>
                        <button id="btn-style-bold" class="toolbar-btn toolbar-btn-style" type="button" title="굵게"><b>B</b></button>
                        <button id="btn-style-italic" class="toolbar-btn toolbar-btn-style" type="button" title="기울임"><i>I</i></button>
                        <button id="btn-style-underline" class="toolbar-btn toolbar-btn-style" type="button" title="밑줄"><u>U</u></button>
                    </div>
                </div>
                <div class="ribbon-group-title">글꼴</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="column-count-select">다단</label>
                        <select id="column-count-select" class="toolbar-select">
                          <option value="1">1단</option>
                          <option value="2">2단</option>
                          <option value="3">3단</option>
                        </select>
                        <label class="toolbar-label" for="align-select">정렬</label>
                        <select id="align-select" class="toolbar-select">
                          <option value="left">왼쪽</option>
                          <option value="center">가운데</option>
                          <option value="right">오른쪽</option>
                          <option value="justify">양쪽</option>
                        </select>
                    </div>
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="line-spacing-select">줄간격</label>
                        <select id="line-spacing-select" class="toolbar-select">
                          <option value="100">100%</option>
                          <option value="120">120%</option>
                          <option value="150">150%</option>
                          <option value="160">160%</option>
                          <option value="200">200%</option>
                        </select>
                    </div>
                </div>
                <div class="ribbon-group-title">단락</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-items">
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="text-color-input">글자색</label>
                        <input id="text-color-input" class="toolbar-color" type="color" value="#000000" title="글자색 (두 번 클릭하면 기본값)">
                    </div>
                    <div class="ribbon-row">
                        <label class="toolbar-label" for="bg-color-input">배경색</label>
                        <input id="bg-color-input" class="toolbar-color" type="color" value="#ffffff" title="배경색 (두 번 클릭하면 없음)">
                    </div>
                </div>
                <div class="ribbon-group-title">색</div>
            </div>
        </div>
        <input id="file-input" type="file" accept=".hwp,.docx,.odt" hidden />
    </div>

    <div class="editor-viewport">
        <div id="editor-container" spellcheck="false"></div>
    </div>

    <div class="preview-toolbar" style="display:none">
        <span id="preview-mode-label" class="statusbar-info" title="페이지를 클릭하면 쪽맞춤으로 전환">미리보기 (읽기 전용)</span>
        <span class="statusbar-spacer"></span>
        <button id="btn-preview-edit" class="toolbar-btn" type="button">편집</button>
        <button id="btn-preview-close" class="toolbar-btn" type="button">닫기</button>
    </div>
    <div class="preview-viewport" style="display:none">
        <div id="preview-container"></div>
    </div>

    <div id="cell-menu" class="context-menu" style="display:none">
        <button id="cell-menu-merge" type="button">셀 합치기 (M)</button>
    </div>

    <div class="statusbar">
        <span id="cursor-page" class="statusbar-info" title="커서 위치 페이지">- / -</span>
        <span class="statusbar-spacer"></span>
        <button id="btn-zoom-out" class="statusbar-btn" type="button" title="축소">−</button>
        <button id="zoom-label" class="statusbar-zoom" type="button">100%</button>
        <button id="btn-zoom-in" class="statusbar-btn" type="button" title="확대">＋</button>
    </div>
<script src="/odt/jszip.bundle.js"></script>
<script src="/odt/odt.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
