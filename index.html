<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>정밀 폰트 매트릭스 기반 웹 워커 워드프로세서</title>
    <style>
        body {
            background-color: #f0f3f6;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }

        /* 툴바 */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 46px;
            background: #ffffff;
            border-bottom: 1px solid #d8dde3;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        .toolbar-btn {
            height: 30px;
            padding: 0 14px;
            border: 1px solid #ccd3da;
            border-radius: 6px;
            background: #f7f9fa;
            color: #333;
            font-size: 13px;
            cursor: pointer;
        }
        .toolbar-btn:hover { background: #eef2f5; }
        .toolbar-btn:active { background: #e2e8ee; }
        .toolbar-select {
            height: 30px;
            border: 1px solid #ccd3da;
            border-radius: 6px;
            background: #ffffff;
            color: #333;
            font-size: 13px;
            padding: 0 6px;
            box-sizing: border-box;
            max-width: 180px;
        }
        .toolbar-select:disabled {
            background: #f0f2f4;
            color: #a6aeb5;
        }
        .status {
            font-size: 12px;
            color: #888;
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

/* 드래그 앤 드롭 오버레이 */
        .editor-viewport.is-dragging::before {
            content: 'HWP 파일을 놓아주세요';
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(74, 144, 217, 0.12);
            border: 4px dashed #4a90d9;
            color: #2b6cb0;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
        .hwp-dropzone {
            height: calc(100% - 48px);
            margin: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a94a0;
            font-size: 15px;
            border: 2px dashed #ccd3da;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
        }

        /* [수정] 스크롤바와 패딩을 담당하는 뷰포트 (툴바 높이만큼 상단 여백) */
        .editor-viewport {
            width: 100%;
            height: calc(100% - 46px);
            margin-top: 46px;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 40px 0; /* 상하 여백만 부여 (좌우 여백은 내부에서 통제) */
            box-sizing: border-box;
            /* ⚠️ 브라우저 버그를 유발하는 grid/flex 정렬을 완전히 제거합니다 */
            display: block; 
            text-align: center; /* 데스크톱 환경에서 자식을 중앙으로 보내기 위한 트리거 */
        }

        /* [수정] 에디터 컨테이너를 감싸는 안전 마진 래퍼 */
        #editor-container {
            /* ⚠️ 인라인 블록으로 지정하여 text-align: center의 영향을 받게 함 (데스크톱 중앙 정렬) */
            display: inline-flex; 
            flex-direction: column;
            gap: 30px;
            width: 800px;
            min-width: 800px;
            
            /* ⚠️ 양옆에 실제 픽셀 여백을 패딩으로 강제 주입하여 모바일 좌우 여백 확보 */
            padding: 0 20px; 
            box-sizing: content-box; /* 패딩이 800px 바깥으로 더해져 총 840px이 되도록 설정 */
            
            /* 텍스트 정렬이 자식에게 상속되는 것을 방지하기 위해 왼쪽 정렬로 리셋 */
            text-align: left; 
        }

        /* .page 및 하위 요소 스타일은 그대로 유지합니다 */
        .page {
            width: 800px;
            height: 900px; 
            background: white;
            padding: 60px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
            position: relative;
            outline: none;
            -webkit-text-size-adjust: none;
        }
        .page::after {
            content: attr(data-page-number);
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
        }
        p {
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            line-height: 26px;
            margin: 0; 
            padding: 0;
            word-break: break-all;
        }
        p::after {
            content: " ↵";
            color: #c0c4cc;
            font-weight: normal;
            font-size: 14px;
            user-select: none;
            pointer-events: none;
        }
        p:has(span:empty)::after, 
        p:has(span:contains('\u200B'))::after {
            position: absolute;
            left: 0;
            top: 0;
        }
        /* index.html <style> 내부의 표 스타일 부분을 아래 내용으로 덮어씌우세요 */

table {
    width: 680px; /* 본문 가용 최대 폭 (800px - 패딩 120px) */
    border-collapse: collapse;
    margin: 15px 0;
    table-layout: fixed; /* 가로 고정 픽셀 분배 */
    
    /* [추가] 테이블 외곽 테두리를 확실하게 잡아줍니다 */
    border: 1px solid #a0a4a8; 
}

/* ⚠️ td와 함께 th(존재할 경우)까지 완벽하게 테두리를 지정합니다 */
table td, table th {
    /* 기존 옅은 색(#dcdfe6) 대신 살짝 더 선명한 회색(#b0b4b8)으로 변경 */
    border: 1px solid #b0b4b8 !important; 
    padding: 7px 8px; /* 워커의 TABLE_CELL_PADDING 규격과 매칭 */
    font-family: 'Arial', sans-serif;
    font-size: 16px;
    line-height: 26px; /* 워커의 LINE_HEIGHT */
    color: #333;
    word-break: break-all;
    vertical-align: top;
    text-align: left;
}

/* 짝수 행 배경 음영 (가독성 향상) */
table tr:nth-child(even) {
    background-color: #f7f9fa;
}
    </style>
</head>
<body>

    <div class="toolbar">
        <button id="btn-open-hwp" class="toolbar-btn" type="button">HWP 파일 열기</button>
        <input id="hwp-file" type="file" accept=".hwp,application/x-hwp" hidden />
        <label class="toolbar-label" for="font-family-select">글꼴</label>
        <select id="font-family-select" class="toolbar-select" disabled></select>
        <label class="toolbar-label" for="font-size-select">크기</label>
        <select id="font-size-select" class="toolbar-select" disabled></select>
        <span id="hwp-status" class="status"></span>
    </div>

    <div class="editor-viewport">
        <div id="editor-container"></div>
    </div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
