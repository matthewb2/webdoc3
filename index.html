<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정밀 폰트 매트릭스 기반 웹 워커 워드프로세서</title>
    <style>
        body {
            background-color: #f0f3f6;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Arial', sans-serif;
        }
        #editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .page {
            width: 800px; /* 가로 가용 폭 800px */
            height: 900px; /* min-height 대신 고정 height로 A4 한 장 규격화 */
            background: white;
            padding: 60px; /* 좌우 패딩 60px * 2 = 120px 제외하면 본문 가로영역은 680px */
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
            position: relative;
            outline: none;
        }
        .page::after {
            content: attr(data-page-number);
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
        }
        p {
            /* 워커의 폰트 측정 기준인 16px Arial과 정확히 일치시킵니다 */
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            line-height: 26px; /* 워커의 LINE_HEIGHT 상수와 일치 */
            margin: 0; /* ⚠️ 브라우저 기본 마진을 0으로 만들어 워커 계산과 일치시킵니다 */
    padding: 0;
            word-break: break-all;
        }
        /* [핵심] 모든 단락 끝에 문단 부호(Pilcrow) 추가 */
    p::after {
        content: " ↵";
        color: #c0c4cc; /* 평소에는 연한 회색으로 노출 */
        font-weight: normal;
        font-size: 14px;
        user-select: none; /* 사용자가 마우스로 드래그해도 선택되지 않음 */
        pointer-events: none; /* 클릭 이벤트 방해 금지 */
    }

    /* 빈 줄(엔터만 친 곳)에도 문단 부호가 자연스럽게 위치하도록 설정 */
    p:has(span:empty)::after, 
    p:has(span:contains('\u200B'))::after {
        position: absolute;
        left: 0;
        top: 0;
    }
    </style>
</head>
<body>
    <div id="editor-container"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
